<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1430">
  <meta name="description" content="推しVTuberを落とせ！ 新人VTuber・天音ハルを配信のコメントから攻略する、スマホで遊べる恋愛シミュレーションゲーム">
  <meta property="og:type" content="website">
  <meta property="og:title" content="推しVTuberを落とせ！ 〜新人VTuber・天音ハル攻略作戦〜">
  <meta property="og:description" content="配信のコメントから始まる恋。選択肢しだいで恋人にも、一発BANにも。エンド32種、スマホで遊べる恋愛ゲーム">
  <meta property="og:image" content="https://satoshim1992.github.io/otsuharu/img/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="推しVTuberを落とせ！ 〜新人VTuber・天音ハル攻略作戦〜">
  <meta property="og:url" content="https://satoshim1992.github.io/otsuharu/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://satoshim1992.github.io/otsuharu/img/ogp.png">
  <title>推しVTuberを落とせ！ 〜新人VTuber・天音ハル攻略作戦〜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.5/lib/three-vrm.module.min.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="screen-title" class="screen is-active">
    <button class="sound-toggle title-sound" aria-label="音のオン・オフ">🔊</button>
    <div class="title-sky"></div>
    <div id="title-avatar" class="title-avatar"></div>
    <div class="title-logo">
      <p class="title-sub">〜新人VTuber・天音ハル攻略作戦〜</p>
      <h1><span class="t-small">推しVTuberを</span><span class="t-big">落とせ！</span></h1>
    </div>
    <nav class="title-menu">
      <button class="btn btn-primary" data-action="new">はじめから</button>
      <button class="btn" data-action="continue" hidden>つづきから</button>
      <button class="btn" data-action="gallery">ギャラリー</button>
    </nav>
    <p class="title-foot">エンド回収 <span id="title-progress">0/14</span></p>
  </section>

  <!-- ハンドルネーム入力 -->
  <section id="screen-name" class="screen">
    <form id="name-form" class="sheet">
      <h2>ハンドルネームを決めよう</h2>
      <p class="hint">配信のコメント欄に表示される名前です</p>
      <input id="name-input" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="名無しのリスナー">
      <p id="name-msg" class="name-msg" aria-live="polite"></p>
      <button class="btn btn-primary" type="submit">けってい</button>
      <button class="btn btn-ghost" type="button" data-action="back">もどる</button>
    </form>
  </section>

  <!-- ゲーム本編 -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <span id="hud-chapter" class="hud-chapter"></span>
      <span id="hud-debug" class="hud-debug" hidden></span>
      <span class="hud-subs-wrap" aria-label="チャンネル登録者数">登録者 <b id="hud-subs">180</b>人</span>
      <div id="heart-meter" class="heart-meter" aria-label="好感度" hidden><span id="heart-fill" class="heart-fill"></span></div>
      <button id="btn-skip" class="hud-menu hud-skip" aria-label="既読スキップ" aria-pressed="false">⏩</button>
      <button class="hud-menu sound-toggle" aria-label="音のオン・オフ">🔊</button>
      <button id="btn-menu" class="hud-menu" aria-label="メニュー">☰</button>
    </header>

    <div id="stage" class="stage" data-bg="room">
      <div class="stage-bg"></div>
      <div id="avatar" class="avatar is-none"></div>
      <div class="stream-overlay">
        <span class="live-badge">● LIVE</span>
        <span class="viewers">👤 <b id="viewers">23</b></span>
        <p id="stream-title" class="stream-title"></p>
      </div>
      <div class="call-overlay">
        <p class="call-name">天音ハル</p>
        <p id="call-time" class="call-time">00:00</p>
      </div>
    </div>

    <div class="dm-header"><span class="dm-icon"></span><b>天音ハル</b><small>オンライン</small></div>
    <div id="comments" class="comments" aria-live="off"></div>
    <div id="chat" class="chat"></div>
    <p class="tap-hint">タップで次へ ▼</p>

    <div id="msg" class="msg" hidden>
      <p id="msg-name" class="msg-name"></p>
      <p id="msg-text" class="msg-text"></p>
      <span class="msg-next">▼</span>
    </div>

    <div id="choices" class="choices" hidden></div>
    <div id="popups" class="popups"></div>

    <div id="card" class="card" hidden>
      <p class="card-sub"></p>
      <h2 class="card-title"></h2>
      <p class="card-tap">タップしてはじめる</p>
    </div>

    <div id="blackout" class="blackout" hidden>
      <p class="blackout-text"></p>
      <p class="card-tap">タップして次へ</p>
    </div>

    <div id="menu" class="menu" hidden>
      <div class="menu-box">
        <button class="btn" data-action="log">ログを見る</button>
        <button class="btn" data-action="title">タイトルへもどる</button>
        <button class="btn btn-ghost" data-action="close">とじる</button>
        <p class="hint">つづきは、いまのシーンの最初から再開されます</p>
      </div>
    </div>

    <div id="log" class="log" hidden>
      <div class="log-box">
        <h2>ログ</h2>
        <div id="log-list" class="log-list"></div>
        <button class="btn" data-action="log-close">とじる</button>
      </div>
    </div>
  </section>

  <!-- エンディング -->
  <section id="screen-ending" class="screen">
    <div class="sheet ending-card">
      <p id="ending-cat" class="ending-cat"></p>
      <div id="ending-emoji" class="ending-emoji"></div>
      <h2 id="ending-title"></h2>
      <p id="ending-desc" class="ending-desc"></p>
      <p id="ending-progress" class="hint"></p>
      <div class="share">
        <button class="btn btn-x" data-action="share-x">𝕏 でシェア</button>
        <button class="btn" data-action="share">シェア／コピー</button>
      </div>
      <p id="share-msg" class="hint" aria-live="polite"></p>
      <button class="btn btn-primary" data-action="title">タイトルへ</button>
    </div>
  </section>

  <!-- ギャラリー -->
  <section id="screen-gallery" class="screen">
    <div class="gallery">
      <h2>ギャラリー</h2>
      <div id="gallery-list"></div>
    </div>
    <div class="gallery-foot"><button class="btn" data-action="back">もどる</button></div>
  </section>

</div>
<noscript><p class="fatal">このゲームを遊ぶにはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
