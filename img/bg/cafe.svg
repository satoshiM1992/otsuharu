<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- カフェの店内・昼 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ead6"/>
      <stop offset="1" stop-color="#efdcc0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87650"/>
      <stop offset="1" stop-color="#7c5235"/>
    </linearGradient>
    <linearGradient id="outside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset=".6" stop-color="#e8f5ff"/>
      <stop offset=".6" stop-color="#cfd8c4"/>
      <stop offset="1" stop-color="#b9c4ad"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2c2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#8cc97a"/>
      <stop offset="1" stop-color="#3f7f46"/>
    </radialGradient>
    <pattern id="planks" width="400" height="22" patternUnits="userSpaceOnUse">
      <rect width="400" height="22" fill="url(#wood)"/>
      <line x1="0" y1="21" x2="400" y2="21" stroke="#5e3d27" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="400" height="800" fill="url(#wall)"/>

  <!-- big window -->
  <rect x="20" y="150" width="230" height="300" rx="6" fill="url(#outside)"/>
  <g opacity=".85">
    <rect x="34" y="250" width="50" height="80" fill="#c8b6a2"/><rect x="90" y="226" width="60" height="104" fill="#d9cbb8"/>
    <rect x="156" y="262" width="80" height="68" fill="#bfae9a"/>
    <circle cx="70" cy="320" r="28" fill="#79b06d"/><circle cx="200" cy="318" r="24" fill="#86bb76"/>
  </g>
  <g fill="#fff" opacity=".35">
    <polygon points="40,160 90,160 40,240"/><polygon points="140,160 170,160 100,300 70,300"/>
  </g>
  <g fill="none" stroke="#6e4a31" stroke-width="8">
    <rect x="20" y="150" width="230" height="300" rx="6"/>
    <line x1="135" y1="150" x2="135" y2="450"/><line x1="20" y1="300" x2="250" y2="300"/>
  </g>
  <rect x="12" y="448" width="246" height="12" rx="3" fill="#8a5d3d"/>

  <!-- chalkboard menu -->
  <rect x="282" y="160" width="100" height="130" rx="6" fill="#2f3b33" stroke="#8a5d3d" stroke-width="6"/>
  <text x="332" y="186" font-family="sans-serif" font-size="14" font-weight="700" fill="#fdf6e3" text-anchor="middle">MENU</text>
  <g stroke="#e8e1cf" stroke-width="2" stroke-linecap="round" opacity=".8">
    <line x1="296" y1="204" x2="352" y2="204"/><line x1="296" y1="222" x2="340" y2="222"/>
    <line x1="296" y1="240" x2="356" y2="240"/><line x1="296" y1="258" x2="336" y2="258"/>
  </g>
  <g fill="#ffb3c7"><circle cx="364" cy="221" r="5"/><circle cx="368" cy="257" r="5"/></g>

  <!-- shelf with cups -->
  <rect x="276" y="330" width="116" height="8" fill="#7c5235"/>
  <rect x="276" y="400" width="116" height="8" fill="#7c5235"/>
  <g>
    <rect x="286" y="306" width="18" height="24" rx="3" fill="#fff"/><rect x="310" y="310" width="16" height="20" rx="3" fill="#f3b7b1"/>
    <rect x="332" y="300" width="22" height="30" rx="4" fill="#b8d6c8"/><rect x="360" y="308" width="18" height="22" rx="3" fill="#fff"/>
    <rect x="288" y="372" width="24" height="28" rx="5" fill="#e9d29a"/><rect x="318" y="378" width="18" height="22" rx="3" fill="#fff"/>
    <rect x="342" y="368" width="16" height="32" rx="3" fill="#9cb4d8"/><rect x="364" y="376" width="20" height="24" rx="4" fill="#f6c9a6"/>
  </g>

  <!-- pendant lamps -->
  <g>
    <line x1="90" y1="0" x2="90" y2="70" stroke="#3d2d22" stroke-width="2"/>
    <circle cx="90" cy="96" r="70" fill="url(#glow)"/>
    <path d="M70 90 q20 -26 40 0 z" fill="#3d2d22"/><ellipse cx="90" cy="90" rx="20" ry="4" fill="#ffe7a6"/>
    <line x1="320" y1="0" x2="320" y2="54" stroke="#3d2d22" stroke-width="2"/>
    <circle cx="320" cy="80" r="64" fill="url(#glow)"/>
    <path d="M302 74 q18 -24 36 0 z" fill="#3d2d22"/><ellipse cx="320" cy="74" rx="18" ry="4" fill="#ffe7a6"/>
  </g>

  <!-- plant -->
  <g>
    <ellipse cx="250" cy="470" rx="34" ry="44" fill="url(#leaf)"/>
    <ellipse cx="226" cy="450" rx="18" ry="30" fill="url(#leaf)" transform="rotate(-25 226 450)"/>
    <ellipse cx="276" cy="452" rx="16" ry="28" fill="url(#leaf)" transform="rotate(25 276 452)"/>
    <path d="M232 500 h36 l-6 40 h-24 z" fill="#c9805b"/>
  </g>

  <!-- wainscot and floor -->
  <rect x="0" y="520" width="400" height="120" fill="url(#planks)"/>
  <rect x="0" y="514" width="400" height="8" fill="#5e3d27"/>
  <rect x="0" y="640" width="400" height="160" fill="#6e4a31"/>
  <g stroke="#5a3b27" stroke-width="2">
    <line x1="0" y1="690" x2="400" y2="690"/><line x1="0" y1="750" x2="400" y2="750"/>
  </g>
</svg>
