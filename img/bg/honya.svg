<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- 駅前の本屋 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6e6"/><stop offset="1" stop-color="#f1dfc2"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="800" fill="url(#wall)"/>
  <circle cx="100" cy="40" r="110" fill="url(#lamp)"/><circle cx="300" cy="40" r="110" fill="url(#lamp)"/>
  <g>
    <rect x="10" y="110" width="180" height="470" fill="#b07a4a"/><rect x="210" y="110" width="180" height="470" fill="#b07a4a"/>
    <g fill="#8a5a32"><rect x="10" y="200" width="180" height="8"/><rect x="10" y="300" width="180" height="8"/><rect x="10" y="400" width="180" height="8"/><rect x="10" y="500" width="180" height="8"/>
      <rect x="210" y="200" width="180" height="8"/><rect x="210" y="300" width="180" height="8"/><rect x="210" y="400" width="180" height="8"/><rect x="210" y="500" width="180" height="8"/></g>
    <g id="row">
      <rect x="18" y="130" width="14" height="70" fill="#ff7fb0"/><rect x="34" y="138" width="12" height="62" fill="#7fb6ff"/><rect x="48" y="128" width="16" height="72" fill="#ffd36b"/>
      <rect x="66" y="140" width="12" height="60" fill="#8fe3b0"/><rect x="80" y="132" width="14" height="68" fill="#b49bff"/><rect x="96" y="136" width="18" height="64" fill="#ff9f7f"/>
      <rect x="116" y="130" width="12" height="70" fill="#7fd0ff"/><rect x="130" y="142" width="14" height="58" fill="#ff7fb0"/><rect x="146" y="128" width="16" height="72" fill="#fff"/><rect x="164" y="138" width="18" height="62" fill="#ffd36b"/>
    </g>
    <use href="#row" y="100"/><use href="#row" y="200"/><use href="#row" y="300"/>
    <use href="#row" x="200"/><use href="#row" x="200" y="100"/><use href="#row" x="200" y="200"/><use href="#row" x="200" y="300"/>
  </g>
  <rect x="120" y="560" width="160" height="40" rx="6" fill="#ff7fb0"/>
  <text x="200" y="587" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">話題の本</text>
  <rect y="600" width="400" height="200" fill="#d8c2a0"/>
</svg>
