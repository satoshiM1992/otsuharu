<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- 水族館のクラゲ水槽 -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5fa8"/>
      <stop offset=".55" stop-color="#123f7a"/>
      <stop offset="1" stop-color="#0a2148"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a36"/>
      <stop offset="1" stop-color="#050c1d"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#bfe8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="jelly" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#ffe3f1" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ffb3d6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8fe0ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8fe0ff" stop-opacity="0"/>
    </radialGradient>
    <g id="j">
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="url(#jelly)"/>
      <path d="M-18 6 Q-22 40 -14 70 M-6 10 Q-10 50 -2 84 M6 10 Q10 46 4 78 M18 6 Q22 38 14 66" stroke="#ffc6e0" stroke-opacity=".55" stroke-width="2" fill="none"/>
    </g>
  </defs>

  <rect width="400" height="800" fill="url(#floor)"/>
  <!-- tank window -->
  <rect x="-10" y="40" width="420" height="560" rx="40" fill="url(#water)"/>
  <polygon points="60,40 120,40 40,600 -20,600" fill="url(#ray)"/>
  <polygon points="200,40 250,40 220,600 150,600" fill="url(#ray)" opacity=".7"/>
  <polygon points="330,40 380,40 420,600 330,600" fill="url(#ray)" opacity=".8"/>
  <circle cx="200" cy="300" r="220" fill="url(#glow)"/>

  <!-- jellyfish -->
  <use href="#j" transform="translate(80 170) scale(1.2)"/>
  <use href="#j" transform="translate(300 120) scale(.9)"/>
  <use href="#j" transform="translate(330 330) scale(1.4)"/>
  <use href="#j" transform="translate(150 380) scale(.7)"/>
  <use href="#j" transform="translate(60 470) scale(.9)"/>
  <use href="#j" transform="translate(230 220) scale(.55)"/>

  <!-- bubbles -->
  <g fill="none" stroke="#d8f3ff" stroke-opacity=".6" stroke-width="1.5">
    <circle cx="40" cy="540" r="5"/><circle cx="48" cy="510" r="3"/><circle cx="36" cy="480" r="4"/>
    <circle cx="370" cy="560" r="4"/><circle cx="362" cy="520" r="6"/><circle cx="374" cy="470" r="3"/>
  </g>

  <!-- window frame + floor -->
  <rect x="-10" y="40" width="420" height="560" rx="40" fill="none" stroke="#06122b" stroke-width="14"/>
  <rect y="600" width="400" height="200" fill="url(#floor)"/>
  <ellipse cx="200" cy="640" rx="230" ry="26" fill="#2a6cc0" opacity=".25"/>
</svg>
