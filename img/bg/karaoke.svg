<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- カラオケボックス -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1846"/><stop offset="1" stop-color="#1a0f2e"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee0ff"/><stop offset=".5" stop-color="#9b7bff"/><stop offset="1" stop-color="#ff7fb0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9b7bff" stop-opacity=".55"/><stop offset="1" stop-color="#9b7bff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.6" fill="#ff9fd0" opacity=".25"/></pattern>
  </defs>
  <rect width="400" height="800" fill="url(#wall)"/>
  <rect width="400" height="560" fill="url(#dots)"/>
  <circle cx="200" cy="230" r="230" fill="url(#glow)"/>
  <rect x="70" y="120" width="260" height="160" rx="10" fill="#0d0820"/>
  <rect x="80" y="130" width="240" height="140" rx="6" fill="url(#screen)" opacity=".9"/>
  <g fill="#fff" opacity=".9"><rect x="105" y="235" width="190" height="8" rx="4"/><rect x="125" y="252" width="150" height="6" rx="3" opacity=".6"/></g>
  <g fill="#fff" opacity=".7"><circle cx="150" cy="185" r="6"/><circle cx="200" cy="175" r="8"/><circle cx="250" cy="190" r="5"/></g>
  <g stroke="#ff7fb0" stroke-width="3" opacity=".7"><line x1="30" y1="60" x2="370" y2="60"/></g>
  <g fill="#ffe28a"><circle cx="40" cy="60" r="5"/><circle cx="110" cy="60" r="5"/><circle cx="180" cy="60" r="5"/><circle cx="250" cy="60" r="5"/><circle cx="320" cy="60" r="5"/></g>
  <rect x="-10" y="560" width="420" height="80" rx="16" fill="#7a2a55"/>
  <rect x="-10" y="600" width="420" height="200" fill="#4a1a36"/>
  <rect x="150" y="520" width="100" height="40" rx="6" fill="#2e2442"/>
  <rect x="160" y="528" width="30" height="24" rx="4" fill="#5ee0ff" opacity=".6"/>
</svg>
