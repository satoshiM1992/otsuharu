<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- 駅前広場・日曜の午後一時 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc2ff"/>
      <stop offset=".55" stop-color="#cfeaff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d2c4"/>
      <stop offset="1" stop-color="#b8ae9c"/>
    </linearGradient>
    <pattern id="win" width="14" height="16" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="8" height="9" rx="1" fill="#a9c9e6"/>
    </pattern>
    <pattern id="winDark" width="12" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="8" height="8" rx="1" fill="#8fb1cf"/>
    </pattern>
    <radialGradient id="tree" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#8fd27a"/>
      <stop offset="1" stop-color="#4f9b52"/>
    </radialGradient>
  </defs>

  <rect width="400" height="800" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#fff" opacity=".9">
    <ellipse cx="80" cy="110" rx="46" ry="16"/><ellipse cx="108" cy="98" rx="30" ry="18"/><ellipse cx="62" cy="100" rx="22" ry="13"/>
    <ellipse cx="300" cy="70" rx="40" ry="12"/><ellipse cx="322" cy="60" rx="24" ry="14"/>
    <ellipse cx="250" cy="170" rx="30" ry="9" opacity=".7"/>
  </g>

  <!-- distant buildings -->
  <g fill="#b9cbe0">
    <rect x="0" y="300" width="70" height="240"/>
    <rect x="62" y="260" width="58" height="280"/>
    <rect x="250" y="280" width="64" height="260"/>
    <rect x="306" y="320" width="94" height="220"/>
  </g>
  <g>
    <rect x="0" y="300" width="70" height="240" fill="url(#winDark)" opacity=".7"/>
    <rect x="62" y="260" width="58" height="280" fill="url(#winDark)" opacity=".7"/>
    <rect x="250" y="280" width="64" height="260" fill="url(#winDark)" opacity=".7"/>
    <rect x="306" y="320" width="94" height="220" fill="url(#winDark)" opacity=".7"/>
  </g>

  <!-- station building (right) -->
  <rect x="210" y="360" width="190" height="190" fill="#f1ebe0"/>
  <rect x="210" y="352" width="190" height="14" fill="#c9b9a2"/>
  <rect x="226" y="380" width="160" height="60" fill="url(#win)"/>
  <rect x="250" y="452" width="70" height="20" rx="3" fill="#2f6db5"/>
  <text x="285" y="467" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">はるみ駅</text>
  <rect x="200" y="478" width="200" height="10" fill="#8a7c69"/>
  <rect x="236" y="488" width="120" height="62" fill="#5b6f86" opacity=".85"/>
  <g stroke="#e8e1d4" stroke-width="3"><line x1="276" y1="488" x2="276" y2="550"/><line x1="316" y1="488" x2="316" y2="550"/></g>

  <!-- clock tower (left) -->
  <rect x="30" y="250" width="44" height="300" fill="#e9dccb"/>
  <rect x="26" y="244" width="52" height="10" fill="#b8a48a"/>
  <polygon points="26,244 52,212 78,244" fill="#a86f5a"/>
  <circle cx="52" cy="286" r="17" fill="#fffaf0" stroke="#7a6550" stroke-width="3"/>
  <g stroke="#3d3229" stroke-width="2.5" stroke-linecap="round">
    <line x1="52" y1="286" x2="52" y2="274"/>
    <line x1="52" y1="286" x2="60" y2="290"/>
  </g>
  <rect x="38" y="320" width="28" height="200" fill="url(#win)" opacity=".5"/>

  <!-- trees -->
  <g>
    <rect x="92" y="470" width="8" height="80" fill="#7b5a3e"/>
    <circle cx="96" cy="452" r="34" fill="url(#tree)"/><circle cx="76" cy="470" r="22" fill="url(#tree)"/><circle cx="118" cy="474" r="20" fill="url(#tree)"/>
    <rect x="366" y="482" width="8" height="70" fill="#7b5a3e"/>
    <circle cx="370" cy="462" r="30" fill="url(#tree)"/><circle cx="392" cy="480" r="20" fill="url(#tree)"/><circle cx="350" cy="482" r="18" fill="url(#tree)"/>
  </g>

  <!-- plaza -->
  <rect x="0" y="540" width="400" height="260" fill="url(#ground)"/>
  <g stroke="#c4baa8" stroke-width="2">
    <line x1="0" y1="580" x2="400" y2="580"/><line x1="0" y1="640" x2="400" y2="640"/><line x1="0" y1="720" x2="400" y2="720"/>
    <line x1="200" y1="540" x2="200" y2="800"/><line x1="140" y1="540" x2="40" y2="800"/><line x1="260" y1="540" x2="360" y2="800"/>
    <line x1="80" y1="540" x2="-120" y2="800"/><line x1="320" y1="540" x2="520" y2="800"/>
  </g>
  <rect x="0" y="536" width="400" height="8" fill="#9e9381"/>

  <!-- lamp posts -->
  <g fill="#4a5363">
    <rect x="62" y="470" width="4" height="96"/><rect x="54" y="462" width="20" height="10" rx="3"/>
    <rect x="334" y="476" width="4" height="92"/><rect x="326" y="468" width="20" height="10" rx="3"/>
  </g>

  <!-- people (small, far) -->
  <g opacity=".75">
    <rect x="168" y="512" width="9" height="26" rx="4" fill="#6c7ea8"/><circle cx="172.5" cy="507" r="5" fill="#4a3a30"/>
    <rect x="230" y="514" width="9" height="24" rx="4" fill="#c9837a"/><circle cx="234.5" cy="509" r="5" fill="#2e2622"/>
    <rect x="243" y="516" width="8" height="22" rx="4" fill="#8bb08c"/><circle cx="247" cy="511" r="4.5" fill="#5a4535"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#4d6a8c" stroke-width="1.6" stroke-linecap="round">
    <path d="M180 140 q5 -5 10 0 q5 -5 10 0"/><path d="M206 128 q4 -4 8 0 q4 -4 8 0"/>
  </g>
</svg>
