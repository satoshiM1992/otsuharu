<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- 夕焼けの川沿い -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5aa6"/>
      <stop offset=".3" stop-color="#c77fb0"/>
      <stop offset=".52" stop-color="#ff9d7a"/>
      <stop offset=".62" stop-color="#ffd08a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset=".25" stop-color="#ffe3a0"/>
      <stop offset="1" stop-color="#ffb070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a47c"/>
      <stop offset="1" stop-color="#7a5f95"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7a52"/>
      <stop offset="1" stop-color="#4c4a3c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="800" fill="url(#sky)"/>

  <!-- clouds lit from below -->
  <g fill="#ffc2a1" opacity=".75">
    <ellipse cx="90" cy="150" rx="70" ry="10"/><ellipse cx="120" cy="140" rx="40" ry="8"/>
    <ellipse cx="310" cy="220" rx="80" ry="9"/><ellipse cx="280" cy="210" rx="36" ry="7"/>
    <ellipse cx="200" cy="300" rx="60" ry="6" opacity=".7"/>
  </g>

  <!-- sun -->
  <circle cx="320" cy="405" r="130" fill="url(#sun)"/>
  <circle cx="320" cy="405" r="26" fill="#fff4cf"/>

  <!-- distant city -->
  <g fill="#6d5a8c">
    <rect x="0" y="430" width="30" height="60"/><rect x="26" y="410" width="22" height="80"/><rect x="46" y="440" width="40" height="50"/>
    <rect x="84" y="420" width="18" height="70"/><rect x="100" y="446" width="50" height="44"/>
    <rect x="300" y="424" width="26" height="66"/><rect x="324" y="440" width="38" height="50"/><rect x="360" y="414" width="20" height="76"/><rect x="378" y="436" width="22" height="54"/>
    <rect x="160" y="456" width="140" height="34"/>
  </g>
  <g fill="#ffd98a" opacity=".85">
    <rect x="32" y="420" width="3" height="3"/><rect x="40" y="430" width="3" height="3"/><rect x="58" y="452" width="3" height="3"/>
    <rect x="110" y="456" width="3" height="3"/><rect x="306" y="436" width="3" height="3"/><rect x="336" y="452" width="3" height="3"/><rect x="366" y="428" width="3" height="3"/>
  </g>

  <!-- bridge -->
  <g fill="#4a3d63">
    <rect x="0" y="470" width="400" height="8"/>
    <path d="M0 478 h400 v4 h-400z"/>
    <path d="M60 482 q60 -30 120 0 v6 q-60 -26 -120 0z"/>
    <path d="M220 482 q60 -30 120 0 v6 q-60 -26 -120 0z"/>
    <rect x="172" y="478" width="10" height="34"/><rect x="332" y="478" width="10" height="34"/><rect x="52" y="478" width="10" height="34"/>
  </g>
  <g stroke="#4a3d63" stroke-width="1.5">
    <line x1="0" y1="462" x2="400" y2="462"/>
    <line x1="20" y1="462" x2="20" y2="470"/><line x1="60" y1="462" x2="60" y2="470"/><line x1="100" y1="462" x2="100" y2="470"/>
    <line x1="140" y1="462" x2="140" y2="470"/><line x1="180" y1="462" x2="180" y2="470"/><line x1="220" y1="462" x2="220" y2="470"/>
    <line x1="260" y1="462" x2="260" y2="470"/><line x1="300" y1="462" x2="300" y2="470"/><line x1="340" y1="462" x2="340" y2="470"/><line x1="380" y1="462" x2="380" y2="470"/>
  </g>

  <!-- river with reflections -->
  <rect x="0" y="508" width="400" height="70" fill="url(#river)"/>
  <g fill="#fff2c6" opacity=".8">
    <rect x="290" y="516" width="60" height="2" rx="1"/><rect x="304" y="526" width="34" height="2" rx="1"/>
    <rect x="280" y="538" width="78" height="2" rx="1"/><rect x="310" y="550" width="22" height="2" rx="1"/>
    <rect x="296" y="562" width="48" height="2" rx="1"/>
  </g>
  <g fill="#fff" opacity=".25"><rect x="40" y="530" width="40" height="1.5"/><rect x="320" y="544" width="50" height="1.5"/></g>

  <!-- embankment -->
  <path d="M0 576 q200 -14 400 0 v224 h-400z" fill="url(#bank)"/>
  <path d="M0 640 q200 -20 400 0 v26 q-200 -18 -400 0z" fill="#b59a73" opacity=".9"/>

  <!-- power pole and wires -->
  <g stroke="#2f2840" fill="#2f2840">
    <rect x="350" y="300" width="6" height="300" stroke="none"/>
    <rect x="336" y="318" width="34" height="4" stroke="none"/><rect x="340" y="336" width="26" height="3" stroke="none"/>
    <path d="M353 320 Q200 360 0 330" fill="none" stroke-width="1.2"/>
    <path d="M353 338 Q200 380 0 352" fill="none" stroke-width="1"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#3d3050" stroke-width="1.8" stroke-linecap="round">
    <path d="M120 250 q6 -6 12 0 q6 -6 12 0"/><path d="M150 236 q5 -5 10 0 q5 -5 10 0"/><path d="M98 232 q4 -4 8 0 q4 -4 8 0"/>
  </g>

  <!-- tall grass in front -->
  <g fill="#3a3a30">
    <path d="M0 800 L6 690 L12 800Z"/><path d="M14 800 L24 700 L28 800Z"/><path d="M30 800 L36 720 L44 800Z"/>
    <path d="M356 800 L364 700 L370 800Z"/><path d="M372 800 L382 680 L388 800Z"/><path d="M388 800 L396 710 L400 800Z"/>
  </g>
</svg>
