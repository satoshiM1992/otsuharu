<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- 夕方前の遊園地と観覧車 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb8ff"/>
      <stop offset=".5" stop-color="#ffd1c2"/>
      <stop offset="1" stop-color="#ffb08f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c9a8"/>
      <stop offset="1" stop-color="#c9a27e"/>
    </linearGradient>
  </defs>

  <rect width="400" height="800" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#fff" opacity=".8">
    <ellipse cx="70" cy="110" rx="50" ry="16"/><ellipse cx="100" cy="98" rx="30" ry="14"/>
    <ellipse cx="320" cy="70" rx="44" ry="13"/><ellipse cx="346" cy="60" rx="24" ry="11"/>
  </g>

  <!-- ferris wheel -->
  <g transform="translate(250 330)">
    <circle r="170" fill="none" stroke="#fff" stroke-width="6" opacity=".95"/>
    <circle r="150" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
    <g stroke="#fff" stroke-width="2.5" opacity=".85">
      <line x1="-170" y1="0" x2="170" y2="0"/><line x1="0" y1="-170" x2="0" y2="170"/>
      <line x1="-120" y1="-120" x2="120" y2="120"/><line x1="-120" y1="120" x2="120" y2="-120"/>
      <line x1="-65" y1="-157" x2="65" y2="157"/><line x1="-157" y1="-65" x2="157" y2="65"/>
      <line x1="-65" y1="157" x2="65" y2="-157"/><line x1="-157" y1="65" x2="157" y2="-65"/>
    </g>
    <circle r="16" fill="#ff7fb0"/>
    <g stroke="#7a6a9c" stroke-width="2">
      <rect x="-12" y="-186" width="24" height="22" rx="6" fill="#ff7fb0"/>
      <rect x="108" y="-136" width="24" height="22" rx="6" fill="#ffd36b"/>
      <rect x="158" y="-11" width="24" height="22" rx="6" fill="#7fd0ff"/>
      <rect x="108" y="114" width="24" height="22" rx="6" fill="#b49bff"/>
      <rect x="-12" y="164" width="24" height="22" rx="6" fill="#ff9f7f"/>
      <rect x="-132" y="114" width="24" height="22" rx="6" fill="#8fe3b0"/>
      <rect x="-182" y="-11" width="24" height="22" rx="6" fill="#ffd36b"/>
      <rect x="-132" y="-136" width="24" height="22" rx="6" fill="#7fd0ff"/>
    </g>
    <path d="M-10 10 L-70 260 M10 10 L70 260" stroke="#fff" stroke-width="8"/>
  </g>

  <!-- tents and lights -->
  <g>
    <path d="M10 560 L60 500 L110 560 Z" fill="#ff7fb0"/>
    <path d="M30 560 L60 500 L90 560 Z" fill="#fff" opacity=".7"/>
    <rect x="10" y="560" width="100" height="70" fill="#fff4e8"/>
    <path d="M300 580 L350 520 L400 580 Z" fill="#7fb6ff"/>
    <rect x="300" y="580" width="100" height="60" fill="#fff4e8"/>
  </g>
  <path d="M0 470 Q100 500 200 470 T400 470" fill="none" stroke="#7a6a9c" stroke-width="1.5"/>
  <g fill="#ffe28a">
    <circle cx="25" cy="478" r="4"/><circle cx="60" cy="487" r="4"/><circle cx="100" cy="490" r="4"/>
    <circle cx="140" cy="486" r="4"/><circle cx="180" cy="474" r="4"/><circle cx="220" cy="467" r="4"/>
    <circle cx="260" cy="471" r="4"/><circle cx="300" cy="483" r="4"/><circle cx="340" cy="488" r="4"/><circle cx="380" cy="478" r="4"/>
  </g>
  <rect y="630" width="400" height="170" fill="url(#ground)"/>
</svg>
