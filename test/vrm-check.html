<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>VRM表情チェック</title>
<link rel="stylesheet" href="../css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.5/lib/three-vrm.module.min.js"
} }
</script>
<style>
  body { margin: 0; background: #ffd3e4; display: flex; flex-wrap: wrap; gap: 4px; }
  #host { position: absolute; left: 0; top: 0; width: 200px; height: 260px; visibility: hidden; }
  figure { margin: 0; font: 11px monospace; text-align: center; }
  img { display: block; background: #fff0f6; }
  #log { position: fixed; bottom: 0; left: 0; font: 11px monospace; background: #fff8; margin: 0; }
</style>
</head>
<body>
<div id="host"></div>
<pre id="log"></pre>
<script type="module">
// Renders several avatar states by stepping the shared stage by hand and
// snapshotting the canvas (headless Edge barely advances rAF).
import { Avatar } from '../js/avatar.js';
const log = (s) => (document.getElementById('log').textContent += s + '\n');
const host = document.getElementById('host');
const av = new Avatar(host, { vrmUrls: { vtuber: '../models/sample.vrm' } });
av.setModel('vtuber');
const vrm = await av.ready;
if (!vrm?.vrm) { log('vrm FAILED'); throw new Error('no vrm'); }
const { stage } = await import('../js/avatar-vrm.js');
stage.renderer.setAnimationLoop(null);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function shot(label, { expr = 'neutral', talk = null, motion = null, at = 0, w = 200, h = 260 } = {}) {
  host.style.width = w + 'px';
  host.style.height = h + 'px';
  av.setExpression(expr);
  av.setTalking(!!talk);
  if (motion) av.playMotion(motion);
  const steps = Math.round((motion ? at : 1.0) / 0.016);
  for (let i = 0; i < steps; i++) {
    if (talk) av.speakChar(talk);
    stage.clock.getDelta = () => 0.016;
    stage.tick();
  }
  const img = new Image();
  img.src = stage.renderer.domElement.toDataURL();
  const fig = document.createElement('figure');
  fig.append(img, label);
  document.body.append(fig);
  av.setTalking(false);
}

await shot('neutral');
await shot('happy+あ', { expr: 'happy', talk: 'あ' });
await shot('お', { talk: 'お' });
await shot('い', { talk: 'い' });
await shot('shy', { expr: 'shy' });
await shot('sad', { expr: 'sad' });
await shot('angry', { expr: 'angry' });
await shot('surprised', { expr: 'surprised' });
await shot('nod@0.3', { motion: 'nod', at: 0.3 });
await shot('call', { expr: 'happy', w: 150, h: 150 });
log('done');
</script>
</body>
</html>
